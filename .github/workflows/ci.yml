name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://test:test@127.0.0.1:3306/cyberdimension_test
      JWT_SECRET: ci-only-not-for-production
      ADMIN_EMAIL: admin@example.invalid
      ADMIN_PASSWORD: ci-only-not-for-production
      APP_BASE_URL: http://localhost:3000
      MANUS_RUNTIME: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Test
        run: pnpm exec vitest run --exclude server/nvidia.health.test.ts --pool=forks --poolOptions.forks.singleFork=true

      - name: Build
        run: pnpm run build
